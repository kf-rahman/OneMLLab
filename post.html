<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading… — Kazi Rahman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="assets/config.js"></script>
</head>
<body id="top">
  <header>
    <div class="nav">
      <a class="brand" href="index.html">Kazi Rahman</a>
      <nav class="navlinks" aria-label="Primary navigation">
        <a href="index.html#about">About</a>
        <a href="index.html#blog">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 id="post-title">Loading…</h1>
    <div class="byline" id="post-byline"></div>
    <div class="post-content" id="post-content"></div>

    <div class="bottom-controls">
      <a href="index.html#blog">← Back to blog</a>
      <a href="#top">Back to top ↑</a>
    </div>
  </main>

  <div class="lightbox" id="lightbox"><img alt=""></div>

  <footer>
    <div class="footer-inner">
      <div>Kazi Rahman © 2026</div>
      <div class="footer-links">
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Notice</a>
      </div>
    </div>
  </footer>

  <script>
    const sb = supabase.createClient(window.SUPA.url, window.SUPA.anonKey);
    const md = window.markdownit({ html: false, linkify: true, typographer: true });

    // Image sizing via the Markdown title:
    //   ![alt](url "wide")  ![alt](url "full")  ![alt](url "60%")  ![alt](url "500")
    const defaultImage = md.renderer.rules.image
      || ((tokens, idx, opts, env, self) => self.renderToken(tokens, idx, opts));
    md.renderer.rules.image = function (tokens, idx, opts, env, self) {
      const token = tokens[idx];
      const ti = token.attrIndex("title");
      if (ti >= 0) {
        const t = token.attrs[ti][1].trim().toLowerCase();
        let handled = true;
        if (t === "wide") token.attrPush(["class", "wide"]);
        else if (t === "full") token.attrPush(["class", "full"]);
        else if (/^\d+%$/.test(t)) token.attrPush(["style", `width:${t}`]);
        else if (/^\d+$/.test(t)) token.attrPush(["style", `max-width:${t}px;width:100%`]);
        else handled = false;
        if (handled) token.attrs.splice(ti, 1); // consume the directive so it isn't shown as a tooltip
      }
      return defaultImage(tokens, idx, opts, env, self);
    };

    function esc(s) {
      return String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }
    function fmt(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    (async function load() {
      const slug = new URLSearchParams(location.search).get("slug");
      const titleEl = document.getElementById("post-title");
      if (!slug) { titleEl.textContent = "Post not found"; return; }

      const { data, error } = await sb.from("posts").select("*").eq("slug", slug).single();
      if (error || !data) {
        titleEl.textContent = "Post not found";
        document.getElementById("post-content").innerHTML =
          '<p><a href="index.html#blog">← Back to blog</a></p>';
        return;
      }

      document.title = data.title + " — Kazi Rahman";
      titleEl.textContent = data.title;
      document.getElementById("post-byline").innerHTML =
        `<span>By ${esc(data.author || "Kazi Rahman")}</span><span class="dot"></span><span>${fmt(data.post_date)}</span>`;
      document.getElementById("post-content").innerHTML = md.render(data.body || "");
      wireLightbox();
    })();

    // Click any post image to view it full-size.
    function wireLightbox() {
      const box = document.getElementById("lightbox");
      const boxImg = box.querySelector("img");
      document.querySelectorAll(".post-content img").forEach((img) => {
        img.addEventListener("click", () => {
          boxImg.src = img.currentSrc || img.src;
          box.classList.add("open");
        });
      });
      const close = () => { box.classList.remove("open"); boxImg.src = ""; };
      box.addEventListener("click", close);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    }
  </script>
</body>
</html>
